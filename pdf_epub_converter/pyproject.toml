[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf2epub"
version = "0.1.0"
description = "Convert text, scanned, and mixed PDFs into reflowable EPUB books"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "pdf2epub contributors" }]
dependencies = [
  "PyMuPDF>=1.24.0",
  "Pillow>=10.3.0",
  "EbookLib>=0.18",
  "beautifulsoup4>=4.12.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
ui = ["streamlit>=1.36.0"]

[project.scripts]
pdf2epub = "pdf2epub.cli:app"
pdf2epub-ui = "pdf2epub.ui_launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2epub"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
